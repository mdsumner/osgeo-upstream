name: rundown

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: rundown
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render RUNDOWN.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/rundown.py > RUNDOWN.md
      - name: Render wishes.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/wishes.py > wishes.json
      - name: Commit if changed
        run: |
          git add -N wishes.json
          git diff --quiet RUNDOWN.md wishes.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add RUNDOWN.md wishes.json
          git commit -m "RUNDOWN, wishes: regenerate"
          git pull --rebase origin main
          git push origin HEAD:main
